<meta charset="utf-8">
<title>Lift & Fuel</title>

<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1c1c1a;--mu:#76746d;--ac:#e4572e;--ac2:#2a7f62;--ln:#e3e1da;--in:#f0eee8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141413;--card:#1e1e1c;--tx:#f0eee8;--mu:#9a978e;--ln:#2e2d2a;--in:#2a2926}}
:root[data-theme="dark"]{--bg:#141413;--card:#1e1e1c;--tx:#f0eee8;--mu:#9a978e;--ln:#2e2d2a;--in:#2a2926}
*{box-sizing:border-box}
body{margin:0;overflow-x:hidden;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:80px}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:0 0 2px}h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mu);margin:20px 0 8px}
.sub{color:var(--mu);font-size:13px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:10px}
input,select,button{font:inherit;color:var(--tx)}
input,select{background:var(--in);border:1px solid var(--ln);border-radius:9px;padding:9px 10px;min-width:0;width:100%}
button{background:var(--ac);color:#fff;border:0;border-radius:9px;padding:9px 14px;font-weight:600;cursor:pointer}
button.ghost{background:var(--in);color:var(--tx);font-weight:500}
button.x{background:none;color:var(--mu);padding:2px 8px;font-size:18px}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.row>button{flex:none}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.bar{height:8px;background:var(--in);border-radius:5px;overflow:hidden;margin:4px 0 10px}
.bar i{display:block;height:100%;background:var(--ac);border-radius:5px}
.bar i.p{background:var(--ac2)}.bar i.over{background:#c0392b}
.lab{display:flex;justify-content:space-between;font-size:13px}
.big{font-size:30px;font-weight:700}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--ln);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;color:var(--mu);border-radius:0;padding:14px 4px;font-weight:600}
nav button.on{color:var(--ac)}
.item{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--ln)}
.item:last-child{border:0}.item>:first-child{min-width:0;overflow-wrap:anywhere}.item{gap:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{background:var(--in);color:var(--tx);font-weight:500;padding:6px 11px;border-radius:99px;font-size:13px}
.chip.on{background:var(--ac);color:#fff}
.set{display:grid;grid-template-columns:30px 1fr 1fr 58px 30px;gap:6px;align-items:center;margin-top:6px}
.pr{background:var(--ac2);color:#fff;font-size:11px;padding:2px 7px;border-radius:99px;margin-left:6px}
.mu{color:var(--mu);font-size:13px}
svg{width:100%;height:auto;display:block}
.hide{display:none}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.ph{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;cursor:pointer;background:var(--in)}nav button{font-size:12px;padding-left:2px;padding-right:2px}summary{cursor:pointer;list-style:none}summary::-webkit-details-marker{display:none}
</style>
