<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lift & Fuel</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1c1c1a;--mu:#76746d;--ac:#e4572e;--ac2:#2a7f62;--ln:#e3e1da;--in:#f0eee8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141413;--card:#1e1e1c;--tx:#f0eee8;--mu:#9a978e;--ln:#2e2d2a;--in:#2a2926}}
:root[data-theme="dark"]{--bg:#141413;--card:#1e1e1c;--tx:#f0eee8;--mu:#9a978e;--ln:#2e2d2a;--in:#2a2926}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:80px}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:0 0 2px}h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mu);margin:20px 0 8px}
.sub{color:var(--mu);font-size:13px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:10px}
input,select,button{font:inherit;color:var(--tx)}
input,select{background:var(--in);border:1px solid var(--ln);border-radius:9px;padding:9px 10px;min-width:0;width:100%}
button{background:var(--ac);color:#fff;border:0;border-radius:9px;padding:9px 14px;font-weight:600;cursor:pointer}
button.ghost{background:var(--in);color:var(--tx);font-weight:500}
button.x{background:none;color:var(--mu);padding:2px 8px;font-size:18px}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.row>button{flex:none}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.bar{height:8px;background:var(--in);border-radius:5px;overflow:hidden;margin:4px 0 10px}
.bar i{display:block;height:100%;background:var(--ac);border-radius:5px}
.bar i.p{background:var(--ac2)}.bar i.over{background:#c0392b}
.lab{display:flex;justify-content:space-between;font-size:13px}
.big{font-size:30px;font-weight:700}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--ln);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;color:var(--mu);border-radius:0;padding:14px 4px;font-weight:600}
nav button.on{color:var(--ac)}
.item{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--ln)}
.item:last-child{border:0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{background:var(--in);color:var(--tx);font-weight:500;padding:6px 11px;border-radius:99px;font-size:13px}
.chip.on{background:var(--ac);color:#fff}
.set{display:grid;grid-template-columns:24px 1fr 1fr 30px;gap:6px;align-items:center;margin-top:6px}
.pr{background:var(--ac2);color:#fff;font-size:11px;padding:2px 7px;border-radius:99px;margin-left:6px}
.mu{color:var(--mu);font-size:13px}
svg{width:100%;height:auto;display:block}
.hide{display:none}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.ph{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;cursor:pointer;background:var(--in)}nav button{font-size:13px}summary{cursor:pointer;list-style:none}summary::-webkit-details-marker{display:none}
</style>

function lib(){
 var el=$('<div></div>');el.appendChild($('<h1>Library</h1>'));el.appendChild($('<div class="sub">Browse exercises and add them to the session for the selected date.</div>'));
 var s=$('<div class="row" style="margin-bottom:10px"><input placeholder="Search exercises"></div>');s.firstChild.value=LQ;el.appendChild(s);
 var ch=$('<div class="chips"></div>');['All','Chest','Back','Shoulders','Arms','Quads','Hams & Glutes','Calves','Core','Full Body'].forEach(function(m){var b=$('<button class="chip'+(m===LF?' on':'')+'">'+esc(m)+'</button>');b.onclick=function(){LF=m;render()};ch.appendChild(b)});el.appendChild(ch);
 var box=$('<div></div>');
 function list(){box.innerHTML='';var q=LQ.toLowerCase();LIB.filter(function(x){return(LF==='All'||x[1]===LF)&&(!q||(x[0]+' '+x[1]+' '+x[2]).toLowerCase().indexOf(q)>=0)}).forEach(function(x){var b0=best(x[0]);var c=$('<div class="card"><div class="lab"><b>'+x[0]+'</b><button class="chip" data-a>+ Add</button></div><div class="mu">'+esc(x[1])+' · '+x[2]+(b0?' · best est. 1RM '+Math.round(b0)+' kg':'')+'</div><div style="margin-top:4px">'+x[3]+'</div></div>');c.querySelector('[data-a]').onclick=function(){var ss=S.sess[date]=S.sess[date]||{day:SPLIT[new Date(date+'T12:00:00').getDay()][0],ex:[]};if(!ss.ex.some(function(e){return e.n===x[0]})){ss.ex.push({n:x[0],sets:[]});save()}this.textContent='Added ✓'};box.appendChild(c)});if(!box.children.length)box.innerHTML='<div class="mu">No matches.</div>'}
 s.firstChild.oninput=function(){LQ=this.value;list()};
 list();el.appendChild(box);return el}

function shrink(file,cb){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var s=Math.min(1,720/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=Math.round(im.width*s);cv.height=Math.round(im.height*s);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);cb(cv.toDataURL('image/jpeg',.6))};im.src=r.result};r.readAsDataURL(file)}
function view(p){var m=$('<div style="position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px"><img src="'+p.src+'" style="max-width:100%;max-height:75vh;border-radius:10px"><div style="color:#fff">'+p.d+' · '+p.pose+'</div><div class="row"><button class="ghost">Close</button><button>Delete</button></div></div>');var b=m.querySelectorAll('button');b[0].onclick=function(){m.remove()};b[1].onclick=function(){PH=PH.filter(function(q){return q.id!==p.id});savePh();m.remove();render()};document.body.appendChild(m)}

function body(){
 var el=$('<div></div>');el.appendChild($('<h1>Body</h1>'));el.appendChild($('<div class="sub">Measurements and progress photos.</div>'));el.appendChild(dateBar());
 var ent=S.meas.filter(function(q){return q.d===date})[0]||{};
 var f=$('<div class="card"><b>Measurements (cm)</b><div class="grid3" style="margin-top:8px">'+MK.map(function(m){return '<label class="mu">'+m[1]+'<input data-m="'+m[0]+'" type="number" step="0.1" inputmode="decimal" value="'+(ent[m[0]]||'')+'"></label>'}).join('')+'</div><div class="row" style="margin-top:10px"><button>Save</button></div></div>');
 f.querySelector('button').onclick=function(){var o=S.meas.filter(function(q){return q.d===date})[0];if(!o){o={d:date};S.meas.push(o)}f.querySelectorAll('input').forEach(function(i){var v=parseFloat(i.value);if(v)o[i.dataset.m]=v;else delete o[i.dataset.m]});save();render()};
 el.appendChild(f);
 var ser=function(m){return S.meas.filter(function(q){return q[m]}).sort(function(a,b){return a.d<b.d?-1:1}).map(function(q){return{d:q.d,w:q[m]}})};
 var tc=$('<div class="card"><div class="chips"></div></div>');
 MK.forEach(function(m){var b=$('<button class="chip'+(m[0]===mSel?' on':'')+'">'+m[1]+'</button>');b.onclick=function(){mSel=m[0];render()};tc.firstChild.appendChild(b)});
 tc.insertAdjacentHTML('beforeend',line(ser(mSel)));
 var rows='';MK.forEach(function(m){var s=ser(m[0]);if(s.length){var d=s[s.length-1].w-s[0].w;rows+='<div class="item"><span>'+m[1]+'</span><span><b>'+s[s.length-1].w+' cm</b> <span class="mu">'+(s.length>1?(d>0?'+':'')+d.toFixed(1)+' since first':'first entry')+'</span></span></div>'}});
 if(rows)tc.insertAdjacentHTML('beforeend','<div style="margin-top:8px">'+rows+'</div>');
 el.appendChild(tc);
 var c=$('<div class="card"><div class="lab"><b>Progress photos</b><span class="mu">saved on this device</span></div><div class="row" style="margin-top:8px"><select>'+POSES.map(function(p){return '<option>'+p+'</option>'}).join('')+'</select><input type="file" accept="image/*"></div><div id="phm" class="mu" style="margin-top:6px"></div><div class="chips" style="margin-top:8px"></div></div>');
 var sel=c.querySelector('select');sel.value=PP;sel.onchange=function(){PP=this.value};
 c.querySelector('input').onchange=function(){var fl=this.files[0];if(!fl)return;shrink(fl,function(src){PH.push({id:Date.now(),d:date,pose:sel.value,src:src});if(savePh())render();else{PH.pop();c.querySelector('#phm').textContent='Storage is full. Delete some older photos first.'}})};
 ['All'].concat(POSES).forEach(function(p){var b=$('<button class="chip'+(p===PF?' on':'')+'">'+p+'</button>');b.onclick=function(){PF=p;render()};c.querySelector('.chips').appendChild(b)});
 var ps=PH.filter(function(p){return PF==='All'||p.pose===PF}).sort(function(a,b){return a.d<b.d?1:a.d>b.d?-1:b.id-a.id});
 if(PF!=='All'&&ps.length>1){var a0=ps[ps.length-1],a1=ps[0],cm=$('<div class="grid3" style="grid-template-columns:1fr 1fr;margin-bottom:10px"><div><img class="ph" src="'+a0.src+'"><div class="mu">Start · '+a0.d+'</div></div><div><img class="ph" src="'+a1.src+'"><div class="mu">Latest · '+a1.d+'</div></div></div>');cm.querySelectorAll('img')[0].onclick=function(){view(a0)};cm.querySelectorAll('img')[1].onclick=function(){view(a1)};c.appendChild(cm)}
 var gr=$('<div class="grid3"></div>');
 ps.forEach(function(p){var t=$('<div><img class="ph" src="'+p.src+'"><div class="mu">'+p.d.slice(5)+' · '+p.pose+'</div></div>');t.querySelector('img').onclick=function(){view(p)};gr.appendChild(t)});
 if(!ps.length)gr.innerHTML='<div class="mu" style="grid-column:1/4">No photos yet. Same lighting and pose each time makes comparisons easier.</div>';
 c.appendChild(gr);el.appendChild(c);return el}
render();
