name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - name: Bundle barcode library
        run: |
          f=$(find node_modules/@zxing/library -name 'index.min.js' | head -1)
          if [ -n "$f" ]; then cp "$f" www/zxing.min.js; fi
      - run: npx cap add android
      - name: Add camera permission
        run: sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <application#' android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk lift-and-fuel.apk
      - uses: actions/upload-artifact@v4
        with:
          name: lift-and-fuel-apk
          path: lift-and-fuel.apk
      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest APK
          files: lift-and-fuel.apk
